# ==========================================================
#  SIGEM - Sistema Integral de Gestión de Flotas y Maquinaria
#  TRANSMAQ SUR S.A.C.
# ==========================================================
spring.application.name=sigem
server.port=8080

# ---------- Base de datos PostgreSQL (administrada con pgAdmin 4) ----------
# Cree la base "sigem_db" en pgAdmin y ajuste usuario/clave (o use variables de entorno).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigem_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway crea y versiona las tablas automáticamente (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Hibernate solo valida que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ---------- Vistas, formatos e idioma ----------
spring.thymeleaf.cache=false
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
server.servlet.session.timeout=60m
server.error.whitelabel.enabled=false

# ---------- Parámetros del sistema ----------
# Clave que deben enviar los dispositivos GPS en la cabecera X-API-KEY
sigem.gps.api-key=${GPS_API_KEY:transmaq-gps-2026}
# Carga datos de demostración la primera vez (usuarios, flota, clientes...)
sigem.datos-demo=true
# Revisión de alertas automáticas (cada hora)
sigem.alertas.cron=0 0 * * * *

logging.level.com.transmaqsur.sigem=INFO

# ---------- Datos de la empresa (encabezado de cotizaciones y comprobantes) ----------
sigem.empresa.nombre=TRANSMAQ SUR S.A.C.
sigem.empresa.ruc=20600000000
sigem.empresa.direccion=Parque Industrial de Arequipa, Calle 3 Mz. F Lt. 8, Arequipa
sigem.empresa.telefono=054-600000
sigem.empresa.email=comercial@transmaqsur.pe
