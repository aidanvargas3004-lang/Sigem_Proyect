<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title th:text="${reporte.titulo}">Reporte</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1 th:text="${reporte.titulo}">Reporte</h1><p class="subtitulo" th:text="${reporte.subtitulo}"></p></div>
        <div class="d-flex gap-2 no-print">
            <a class="btn btn-success" th:href="@{/reportes/{c}/excel(c=${reporte.clave},desde=${desde},hasta=${hasta})}"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a>
            <a class="btn btn-danger" th:href="@{/reportes/{c}/pdf(c=${reporte.clave},desde=${desde},hasta=${hasta})}"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>
            <a class="btn btn-light" th:href="@{/reportes}">Volver</a>
        </div>
    </div>
    <div class="card mb-3 no-print" th:unless="${reporte.clave == 'inventario'}"><div class="card-body">
        <form class="row g-2 align-items-end" method="get" th:action="@{/reportes/{c}(c=${reporte.clave})}">
            <div class="col-auto"><label class="form-label">Desde</label><input class="form-control" type="date" name="desde" th:value="${desde}"></div>
            <div class="col-auto"><label class="form-label">Hasta</label><input class="form-control" type="date" name="hasta" th:value="${hasta}"></div>
            <div class="col-auto"><button class="btn btn-primary">Actualizar</button></div>
        </form>
    </div></div>
    <div class="card">
        <div class="table-responsive"><table class="table table-sm table-hover">
            <thead><tr><th th:each="c : ${reporte.columnas}" th:text="${c}"></th></tr></thead>
            <tbody><tr th:each="f : ${reporte.filas}">
                <td th:each="v : ${f}" th:classappend="${@ui.esNumero(v)} ? 'text-end'"
                    th:text="${@ui.celda(v)}"></td>
            </tr></tbody>
            <tfoot th:if="${reporte.tieneTotales()}"><tr class="fw-bold table-warning">
                <td th:each="v : ${reporte.totales}" th:classappend="${@ui.esNumero(v)} ? 'text-end'"
                    th:text="${@ui.celda(v)}"></td></tr></tfoot>
        </table></div>
        <div th:if="${#lists.isEmpty(reporte.filas)}" th:replace="~{fragments/ui :: vacio('No hay datos para el periodo seleccionado')}"></div>
    </div>
</div>
</body>
</html>
