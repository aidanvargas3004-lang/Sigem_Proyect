<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Notificaciones</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1>Notificaciones</h1><p class="subtitulo">Alertas automáticas y avisos del sistema</p></div>
        <form th:action="@{/notificaciones/leer-todas}" method="post"><button class="btn btn-outline-secondary"><i class="bi bi-check2-all me-1"></i>Marcar todas como leídas</button></form>
    </div>
    <div class="card">
        <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action d-flex gap-3" th:each="n : ${pagina.content}"
               th:href="@{/notificaciones/{id}/abrir(id=${n.id})}" th:classappend="${!n.leida} ? 'bg-light'">
                <i class="bi fs-4" th:classappend="|${@ui.icono(n.tipo)} text-${@ui.color(n.tipo)}|"></i>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between">
                        <strong th:text="${n.titulo}">Título</strong>
                        <small class="text-muted" th:text="${@ui.fecha(n.fecha)}"></small>
                    </div>
                    <div th:text="${n.mensaje}"></div>
                </div>
                <span th:if="${!n.leida}" class="badge text-bg-primary align-self-center">Nueva</span>
            </a>
        </div>
        <div th:if="${pagina.empty}" th:replace="~{fragments/ui :: vacio('No tiene notificaciones')}"></div>
        <div th:replace="~{fragments/ui :: paginacion(${pagina})}"></div>
    </div>
</div>
</body>
</html>
