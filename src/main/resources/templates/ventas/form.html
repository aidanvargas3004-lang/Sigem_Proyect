<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title>Comprobante</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header"><h1 th:text="${venta.nuevo} ? 'Nuevo comprobante' : 'Editar comprobante'">Comprobante</h1></div>
    <div class="card"><div class="card-body">
        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">
            <div th:replace="~{fragments/ui :: errores}"></div>
            <input type="hidden" th:field="*{id}">
            <div class="row">
                <div class="col-md-3"><div th:replace="~{fragments/ui :: selectEnum('tipoComprobante', 'Tipo de comprobante', ${tipos}, null)}"></div></div>
                <div class="col-md-6"><div th:replace="~{fragments/ui :: selectEntidad('cliente', 'Cliente', ${clientes}, 'razonSocial', 'Seleccione...')}"></div></div>
                <div class="col-md-3"><div th:replace="~{fragments/ui :: campo('fechaEmision', 'Fecha de emisión', 'date')}"></div></div>
                <div class="col-12"><div th:replace="~{fragments/ui :: areaTexto('observaciones', 'Observaciones')}"></div></div>
            </div>
            <p class="small text-muted">La factura requiere cliente con RUC. El número correlativo se asigna al emitir.</p>
            <button class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar y agregar líneas</button>
            <a class="btn btn-light" th:href="@{/ventas}">Cancelar</a>
        </form>
    </div></div>
</div>
</body>
</html>
