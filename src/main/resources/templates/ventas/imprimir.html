<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${venta.numeroComprobante}">Comprobante</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <style>body{font-size:.9rem;padding:2rem;max-width:900px;margin:auto} .marca{border-bottom:4px solid #f59e0b}</style>
</head>
<body onload="window.print()">
<div class="d-flex justify-content-between align-items-start marca pb-3 mb-4">
    <div class="d-flex gap-3 align-items-center">
        <img th:src="@{/img/logo.svg}" width="60" height="60" alt="">
        <div><h1 class="h4 fw-bold mb-0" th:text="${@ui.empresaNombre}">Empresa</h1>
            <div class="small" th:text="${@ui.empresaDireccion}"></div>
            <div class="small" th:text="|${@ui.empresaTelefono} · ${@ui.empresaEmail}|"></div></div>
    </div>
    <div class="text-center border border-2 rounded p-2">
        <div class="fw-bold" th:text="|RUC ${@ui.empresaRuc}|"></div>
        <div class="fw-bold text-uppercase" th:text="${venta.tipoComprobante.label}"></div>
        <div class="fs-5" th:text="${venta.numeroComprobante}"></div>
    </div>
</div>
<div class="row mb-3">
    <div class="col-8"><strong>Cliente:</strong> <span th:text="${venta.cliente.razonSocial}"></span><br>
        <strong th:text="${venta.cliente.tipoDocumento} + ':'"></strong> <span th:text="${venta.cliente.numeroDocumento}"></span><br>
        <strong>Dirección:</strong> <span th:text="${venta.cliente.direccion ?: '-'}"></span></div>
    <div class="col-4 text-end"><strong>Emisión:</strong> <span th:text="${@ui.fecha(venta.fechaEmision)}"></span><br>
        <strong>Vencimiento:</strong> <span th:text="${@ui.fecha(venta.fechaVencimiento)}"></span><br>
        <strong>Moneda:</strong> Soles</div>
</div>
<table class="table table-bordered">
    <thead class="table-light"><tr><th>#</th><th>Descripción</th><th class="text-end">Cant.</th><th>Und.</th><th class="text-end">P. unit.</th><th class="text-end">Importe</th></tr></thead>
    <tbody><tr th:each="d, st : ${venta.detalles}">
        <td th:text="${st.count}"></td><td th:text="${d.descripcion}"></td><td class="text-end" th:text="${@ui.num(d.cantidad)}"></td>
        <td th:text="${d.unidadMedida}"></td><td class="text-end" th:text="${@ui.soles(d.precioUnitario)}"></td>
        <td class="text-end" th:text="${@ui.soles(d.subtotal)}"></td></tr></tbody>
    <tfoot>
    <tr><td colspan="5" class="text-end">Op. gravada</td><td class="text-end" th:text="${@ui.soles(venta.subtotal)}"></td></tr>
    <tr><td colspan="5" class="text-end">IGV 18%</td><td class="text-end" th:text="${@ui.soles(venta.igv)}"></td></tr>
    <tr class="fw-bold"><td colspan="5" class="text-end">IMPORTE TOTAL</td><td class="text-end" th:text="${@ui.soles(venta.total)}"></td></tr>
    </tfoot>
</table>
<p class="small text-muted mt-4">Representación impresa de uso interno generada por SIGEM. La emisión electrónica ante SUNAT se realiza en el sistema de facturación autorizado.</p>
</body>
</html>
