<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title>Proveedor</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header"><h1 th:text="${proveedor.nuevo} ? 'Nuevo proveedor' : 'Editar proveedor'">Proveedor</h1></div>
    <div class="card"><div class="card-body">
        <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
            <div th:replace="~{fragments/ui :: errores}"></div>
            <input type="hidden" th:field="*{id}">
            <div class="row">
                <div class="col-md-3"><div th:replace="~{fragments/ui :: campo('ruc', 'RUC', 'text')}"></div></div>
                <div class="col-md-6"><div th:replace="~{fragments/ui :: campo('razonSocial', 'Razón social', 'text')}"></div></div>
                <div class="col-md-3"><div th:replace="~{fragments/ui :: campo('rubro', 'Rubro', 'text')}"></div></div>
                <div class="col-md-4"><div th:replace="~{fragments/ui :: campo('contacto', 'Persona de contacto', 'text')}"></div></div>
                <div class="col-md-3"><div th:replace="~{fragments/ui :: campo('telefono', 'Teléfono', 'text')}"></div></div>
                <div class="col-md-5"><div th:replace="~{fragments/ui :: campo('email', 'Correo', 'email')}"></div></div>
                <div class="col-md-9"><div th:replace="~{fragments/ui :: campo('direccion', 'Dirección', 'text')}"></div></div>
                <div class="col-md-3 pt-md-4"><div th:replace="~{fragments/ui :: check('activo', 'Activo')}"></div></div>
            </div>
            <button class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
            <a class="btn btn-light" th:href="@{/proveedores}">Cancelar</a>
        </form>
    </div></div>
</div>
</body>
</html>
