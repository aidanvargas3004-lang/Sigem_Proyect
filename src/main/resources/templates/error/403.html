<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso denegado · SIGEM</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/sigem.css}">
</head>
<body>
<div class="login-bg">
    <div class="card login-card shadow-lg border-0 text-center">
        <div class="card-body p-5">
            <img th:src="@{/img/logo.svg}" alt="" width="56" height="56" class="mb-3">
            <div class="display-5 fw-bold text-warning">403</div>
            <h1 class="h5 fw-bold">Acceso denegado</h1>
            <p class="text-muted">No tiene permisos para acceder a esta opción. Si cree que es un error, solicite el permiso al administrador.</p>
            <a class="btn btn-dark" th:href="@{/}">Volver al inicio</a>
        </div>
    </div>
</div>
</body>
</html>
