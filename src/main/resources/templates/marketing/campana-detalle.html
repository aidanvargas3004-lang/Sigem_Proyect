<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title th:text="${campana.nombre}">Campaña</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1 th:text="${campana.nombre}">Campaña</h1>
            <p class="subtitulo"><span th:text="|${campana.canal.label} · ${@ui.fecha(campana.fechaInicio)} al ${@ui.fecha(campana.fechaFin)}|"></span>
                <span th:replace="~{fragments/ui :: badge(${campana.estado})}"></span></p></div>
        <div class="d-flex gap-2" sec:authorize="hasAuthority('MARKETING_GESTIONAR')">
            <a class="btn btn-primary" th:href="@{/oportunidades/nuevo(campanaId=${campana.id})}"><i class="bi bi-plus-lg me-1"></i>Oportunidad</a>
            <a class="btn btn-outline-secondary" th:href="@{/campanas/{id}/editar(id=${campana.id})}"><i class="bi bi-pencil me-1"></i>Editar</a>
        </div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-3"><div class="card kpi"><div class="icono bg-warning-subtle text-warning-emphasis"><i class="bi bi-wallet2"></i></div>
            <div><div class="valor" th:text="${@ui.soles(campana.presupuesto)}"></div><div class="etiqueta">Presupuesto</div></div></div></div>
        <div class="col-md-3"><div class="card kpi"><div class="icono bg-primary-subtle text-primary"><i class="bi bi-funnel"></i></div>
            <div><div class="valor" th:text="${#lists.size(oportunidades)}"></div><div class="etiqueta">Oportunidades generadas</div></div></div></div>
        <div class="col-md-3"><div class="card kpi"><div class="icono bg-success-subtle text-success"><i class="bi bi-trophy"></i></div>
            <div><div class="valor" th:text="${ganadas}"></div><div class="etiqueta">Ganadas</div></div></div></div>
        <div class="col-md-3"><div class="card kpi"><div class="icono bg-info-subtle text-info-emphasis"><i class="bi bi-graph-up"></i></div>
            <div><div class="valor" th:text="${@ui.soles(montoTotal)}"></div><div class="etiqueta">Monto estimado total</div></div></div></div>
    </div>
    <div class="card mb-3"><div class="card-body">
        <dl class="datos mb-0"><dt>Público objetivo</dt><dd th:text="${campana.publicoObjetivo ?: '-'}"></dd>
            <dt>Descripción</dt><dd th:text="${campana.descripcion ?: '-'}"></dd></dl>
    </div></div>
    <div class="card">
        <div class="card-header">Oportunidades de la campaña</div>
        <div class="table-responsive"><table class="table table-hover">
            <thead><tr><th>Oportunidad</th><th>Cliente</th><th>Etapa</th><th>Probabilidad</th><th class="text-end">Monto</th></tr></thead>
            <tbody><tr th:each="o : ${oportunidades}">
                <td th:text="${o.titulo}"></td><td><a th:href="@{/clientes/{id}(id=${o.cliente.id})}" th:text="${o.cliente.razonSocial}"></a></td>
                <td><span th:replace="~{fragments/ui :: badge(${o.etapa})}"></span></td><td th:text="${o.probabilidad} + '%'"></td>
                <td class="text-end" th:text="${@ui.soles(o.montoEstimado)}"></td></tr></tbody>
        </table></div>
    </div>
</div>
</body>
</html>
