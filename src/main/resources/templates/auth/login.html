<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · SIGEM</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/sigem.css}">
</head>
<body>
<div class="login-bg">
    <div class="card login-card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img th:src="@{/img/logo.svg}" alt="" width="64" height="64" class="mb-3">
                <h1 class="h4 fw-bold mb-1">SIGEM</h1>
                <p class="text-muted small mb-0">Sistema Integral de Gestión de Flotas y Maquinaria<br>TRANSMAQ SUR S.A.C.</p>
            </div>
            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                <i class="bi bi-exclamation-triangle me-1"></i>Usuario o contraseña incorrectos, o usuario inactivo.
            </div>
            <div th:if="${param.salir}" class="alert alert-success py-2 small">
                <i class="bi bi-check-circle me-1"></i>Sesión cerrada correctamente.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input class="form-control" id="username" name="username" required autofocus autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
                    </div>
                </div>
                <button class="btn btn-warning w-100 fw-semibold py-2" type="submit">Ingresar</button>
            </form>
            <p class="text-center text-muted small mt-4 mb-0">Arequipa, Perú</p>
        </div>
    </div>
</div>
</body>
</html>
