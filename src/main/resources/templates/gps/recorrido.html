<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head>
    <title>Recorrido GPS</title>
    <th:block layout:fragment="head"><link rel="stylesheet" th:href="@{/webjars/leaflet/1.9.4/dist/leaflet.css}"></th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1 th:text="'Recorrido de ' + ${unidad.codigo}">Recorrido</h1><p class="subtitulo" th:text="${unidad.descripcion}"></p></div>
        <form class="d-flex gap-2" method="get" th:action="@{/gps/recorrido}">
            <select class="form-select" name="unidadId"><option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.codigo}" th:selected="${u.id == unidad.id}"></option></select>
            <input class="form-control" type="date" name="fecha" th:value="${fecha}">
            <button class="btn btn-primary">Ver</button>
        </form>
    </div>
    <div class="row g-3">
        <div class="col-xl-8"><div id="mapa" class="mapa"></div>
            <p class="text-muted small mt-2" th:if="${#lists.isEmpty(puntos)}">No hay posiciones registradas para esta unidad en la fecha seleccionada.</p></div>
        <div class="col-xl-4"><div class="card"><div class="card-header" th:text="|Posiciones del ${@ui.fecha(fecha)} (${#lists.size(puntos)})|"></div>
            <div class="table-responsive" style="max-height: 440px"><table class="table table-sm">
                <thead><tr><th>Hora</th><th>Coordenadas</th><th>km/h</th><th>Fuente</th></tr></thead>
                <tbody><tr th:each="p : ${puntos}">
                    <td th:text="${#temporals.format(p.fechaHora, 'HH:mm')}"></td>
                    <td class="small" th:text="|${#numbers.formatDecimal(p.latitud, 1, 5)}, ${#numbers.formatDecimal(p.longitud, 1, 5)}|"></td>
                    <td th:text="${p.velocidad ?: '-'}"></td><td class="small" th:text="${p.fuente.label}"></td></tr></tbody>
            </table></div></div></div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/webjars/leaflet/1.9.4/dist/leaflet.js}"></script>
    <script th:inline="javascript">
        const linea = /*[[${linea}]]*/ [];
        const mapa = L.map('mapa').setView([-16.41, -71.52], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(mapa);
        if (linea.length) {
            L.polyline(linea, {color: '#f59e0b', weight: 5}).addTo(mapa);
            L.circleMarker(linea[0], {radius: 7, color: '#198754'}).addTo(mapa).bindPopup('Inicio');
            L.marker(linea[linea.length - 1]).addTo(mapa).bindPopup('Última posición');
            if (linea.length > 1) mapa.fitBounds(linea, {padding: [30, 30]}); else mapa.setView(linea[0], 14);
        }
    </script>
</th:block>
</body>
</html>
