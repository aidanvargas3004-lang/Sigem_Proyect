<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Etiqueta de color para cualquier enumerado con getLabel() -->
<span th:fragment="badge(v)" th:if="${v != null}" class="badge" th:classappend="|text-bg-${@ui.color(v)}|" th:text="${v.label}">Estado</span>

<!-- Errores de negocio/globales de un formulario (usar dentro de th:object) -->
<div th:fragment="errores" th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
    <i class="bi bi-exclamation-triangle me-2"></i>
    <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</span>
</div>

<!-- Campo de texto, número, fecha... -->
<div th:fragment="campo(campo, etiqueta, tipo)" class="mb-3">
    <label class="form-label" th:for="${campo}" th:text="${etiqueta}">Etiqueta</label>
    <input th:type="${tipo}" class="form-control" th:field="*{__${campo}__}" th:errorclass="is-invalid"
           th:attr="step=${tipo == 'number'} ? 'any' : null">
    <div class="invalid-feedback" th:if="${#fields.hasErrors('__${campo}__')}" th:errors="*{__${campo}__}"></div>
</div>

<div th:fragment="areaTexto(campo, etiqueta)" class="mb-3">
    <label class="form-label" th:for="${campo}" th:text="${etiqueta}">Etiqueta</label>
    <textarea class="form-control" rows="3" th:field="*{__${campo}__}" th:errorclass="is-invalid"></textarea>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('__${campo}__')}" th:errors="*{__${campo}__}"></div>
</div>

<!-- Lista desplegable de un enumerado -->
<div th:fragment="selectEnum(campo, etiqueta, valores, vacio)" class="mb-3">
    <label class="form-label" th:for="${campo}" th:text="${etiqueta}">Etiqueta</label>
    <select class="form-select" th:field="*{__${campo}__}" th:errorclass="is-invalid">
        <option th:if="${vacio != null}" value="" th:text="${vacio}">Seleccione</option>
        <option th:each="v : ${valores}" th:value="${v}" th:text="${v.label}">Valor</option>
    </select>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('__${campo}__')}" th:errors="*{__${campo}__}"></div>
</div>

<!-- Lista desplegable de entidades: texto = nombre de la propiedad a mostrar -->
<div th:fragment="selectEntidad(campo, etiqueta, items, texto, vacio)" class="mb-3">
    <label class="form-label" th:for="${campo}" th:text="${etiqueta}">Etiqueta</label>
    <select class="form-select" th:field="*{__${campo}__}" th:errorclass="is-invalid">
        <option th:if="${vacio != null}" value="" th:text="${vacio}">Seleccione</option>
        <option th:each="it : ${items}" th:value="${it.id}" th:text="${it.__${texto}__}">Item</option>
    </select>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('__${campo}__')}" th:errors="*{__${campo}__}"></div>
</div>

<div th:fragment="check(campo, etiqueta)" class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" th:field="*{__${campo}__}">
    <label class="form-check-label" th:for="${#ids.prev('__${campo}__')}" th:text="${etiqueta}">Etiqueta</label>
</div>

<!-- Paginación de un Page de Spring Data (conserva los filtros de la URL) -->
<nav th:fragment="paginacion(pagina)" th:if="${pagina.totalPages > 1}" class="d-flex justify-content-between align-items-center p-3">
    <small class="text-muted" th:text="|Página ${pagina.number + 1} de ${pagina.totalPages} · ${pagina.totalElements} registros|"></small>
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item" th:each="e : ${@ui.enlacesPagina(pagina)}" th:classappend="${e.activo} ? 'active' : (${e.deshabilitado} ? 'disabled')">
            <a class="page-link" th:href="${e.url}" th:text="${e.texto}">1</a></li>
    </ul>
</nav>

<!-- Estado vacío -->
<div th:fragment="vacio(mensaje)" class="text-center text-muted py-5">
    <i class="bi bi-inbox fs-1 d-block mb-2"></i><span th:text="${mensaje}">Sin registros</span>
</div>

<!-- Buscador de tabla -->
<div th:fragment="buscador(tabla)" class="input-group" style="max-width: 320px">
    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
    <input type="search" class="form-control" placeholder="Buscar..." th:attr="data-filtro=${tabla}">
</div>

</body>
</html>
