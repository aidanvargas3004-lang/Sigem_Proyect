<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title>Usuario</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header"><h1 th:text="${usuarioForm.nuevo} ? 'Nuevo usuario' : 'Editar usuario ' + ${usuarioForm.username}">Usuario</h1></div>
    <div class="card"><div class="card-body">
        <form th:action="@{/usuarios/guardar}" th:object="${usuarioForm}" method="post">
            <div th:replace="~{fragments/ui :: errores}"></div>
            <input type="hidden" th:field="*{id}">
            <div class="row">
                <div class="col-md-4" th:if="*{nuevo}"><div th:replace="~{fragments/ui :: campo('username', 'Nombre de usuario', 'text')}"></div></div>
                <div class="col-md-4" th:unless="*{nuevo}"><label class="form-label">Nombre de usuario</label>
                    <input class="form-control" th:value="*{username}" disabled><input type="hidden" th:field="*{username}"></div>
                <div class="col-md-8"><div th:replace="~{fragments/ui :: campo('nombreCompleto', 'Nombre completo', 'text')}"></div></div>
                <div class="col-md-4"><div th:replace="~{fragments/ui :: campo('email', 'Correo', 'email')}"></div></div>
                <div class="col-md-4">
                    <label class="form-label" for="rolId">Rol</label>
                    <select class="form-select" th:field="*{rolId}" th:errorclass="is-invalid">
                        <option value="">Seleccione...</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{rolId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="empleadoId">Empleado vinculado</label>
                    <select class="form-select" th:field="*{empleadoId}">
                        <option value="">(Ninguno)</option>
                        <option th:each="e : ${empleados}" th:value="${e.id}" th:text="${e.nombreCompleto}"></option>
                    </select>
                </div>
                <div class="col-md-4 mt-3"><label class="form-label" for="password" th:text="*{nuevo} ? 'Contraseña' : 'Nueva contraseña (dejar vacío para no cambiar)'"></label>
                    <input class="form-control" type="password" th:field="*{password}" minlength="6" th:required="*{nuevo}" autocomplete="new-password"></div>
            </div>
            <p class="small text-muted mt-3">Vincule el usuario a un empleado para que vea "Mis tareas" (conductores, operadores y técnicos).</p>
            <button class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
            <a class="btn btn-light" th:href="@{/usuarios}">Cancelar</a>
        </form>
    </div></div>
</div>
</body>
</html>
