<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title>Usuarios</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1>Usuarios</h1><p class="subtitulo">Cuentas de acceso al sistema y su rol</p></div>
        <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/roles}"><i class="bi bi-shield-lock me-1"></i>Roles y permisos</a>
            <a sec:authorize="hasAuthority('USUARIOS_GESTIONAR')" class="btn btn-primary" th:href="@{/usuarios/nuevo}"><i class="bi bi-plus-lg me-1"></i>Nuevo usuario</a></div>
    </div>
    <div class="card"><div class="table-responsive"><table class="table table-hover">
        <thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Empleado vinculado</th><th>Último acceso</th><th>Estado</th><th></th></tr></thead>
        <tbody><tr th:each="u : ${usuarios}">
            <td class="fw-semibold" th:text="${u.username}"></td><td th:text="${u.nombreCompleto}"></td>
            <td><span class="badge text-bg-dark" th:text="${u.rol.nombre}"></span></td>
            <td th:text="${u.empleado != null ? u.empleado.nombreCompleto : '-'}"></td>
            <td th:text="${@ui.fecha(u.ultimoAcceso)}"></td>
            <td><span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span></td>
            <td class="text-end text-nowrap" sec:authorize="hasAuthority('USUARIOS_GESTIONAR')">
                <a class="btn btn-sm btn-light" th:href="@{/usuarios/{id}/editar(id=${u.id})}" title="Editar"><i class="bi bi-pencil"></i></a>
                <form class="d-inline" th:action="@{/usuarios/{id}/estado(id=${u.id})}" method="post" data-confirmar="¿Cambiar el estado del usuario?">
                    <button class="btn btn-sm btn-light" th:title="${u.activo} ? 'Desactivar' : 'Activar'"><i class="bi" th:classappend="${u.activo} ? 'bi-person-x' : 'bi-person-check'"></i></button></form>
            </td>
        </tr></tbody>
    </table></div></div>
</div>
</body>
</html>
