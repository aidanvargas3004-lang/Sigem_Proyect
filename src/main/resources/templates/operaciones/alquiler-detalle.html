<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title th:text="${op.codigo}">Alquiler</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1><span th:text="'Alquiler ' + ${op.codigo}"></span> <span th:replace="~{fragments/ui :: badge(${op.estado})}"></span></h1>
            <p class="subtitulo"><a th:href="@{/clientes/{id}(id=${op.cliente.id})}" th:text="${op.cliente.razonSocial}"></a>
                <th:block th:if="${op.contrato != null}">· Contrato <a th:href="@{/contratos/{id}(id=${op.contrato.id})}" th:text="${op.contrato.codigo}"></a></th:block>
                · <span th:text="${op.ubicacionObra ?: ''}"></span></p></div>
        <a sec:authorize="hasAuthority('ALQUILERES_GESTIONAR')" th:if="${op.estado.name() == 'PROGRAMADO'}" class="btn btn-outline-secondary"
           th:href="@{/alquileres/{id}/editar(id=${op.id})}"><i class="bi bi-pencil me-1"></i>Editar</a>
    </div>
    <div class="row g-3">
        <div class="col-lg-7">
            <div th:replace="~{operaciones/comun :: asignacion(${op})}"></div>
            <div class="card"><div class="card-body small">
                <p class="mb-1" style="white-space: pre-line" th:text="${op.observaciones ?: 'Sin observaciones'}"></p>
                <span class="text-muted" th:text="|Registrado el ${@ui.fecha(op.fechaCreacion)} por ${op.creadoPor}|"></span>
            </div></div>
        </div>
        <div class="col-lg-5"><div th:replace="~{operaciones/comun :: acciones(${op}, '/alquileres', 'A')}"></div></div>
    </div>
</div>
</body>
</html>
