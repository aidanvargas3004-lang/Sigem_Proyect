<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Mi perfil</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header"><div><h1>Mi perfil</h1></div></div>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Datos de la cuenta</div>
                <div class="card-body">
                    <dl class="datos row mb-0">
                        <dt class="col-sm-4">Usuario</dt><dd class="col-sm-8" th:text="${usuario.username}"></dd>
                        <dt class="col-sm-4">Nombre</dt><dd class="col-sm-8" th:text="${usuario.nombreCompleto}"></dd>
                        <dt class="col-sm-4">Correo</dt><dd class="col-sm-8" th:text="${usuario.email ?: '-'}"></dd>
                        <dt class="col-sm-4">Rol</dt><dd class="col-sm-8"><span th:text="${usuario.rol.nombre}"></span><br>
                            <small class="text-muted" th:text="${usuario.rol.descripcion}"></small></dd>
                        <dt class="col-sm-4">Empleado</dt><dd class="col-sm-8" th:text="${usuario.empleado != null ? usuario.empleado.nombreCompleto + ' (' + usuario.empleado.cargo.label + ')' : '-'}"></dd>
                        <th:block th:if="${usuario.empleado != null and usuario.empleado.licenciaVencimiento != null}">
                            <dt class="col-sm-4">Licencia</dt>
                            <dd class="col-sm-8"><span th:text="|${usuario.empleado.licenciaNumero} (${usuario.empleado.licenciaCategoria}) vence ${@ui.fecha(usuario.empleado.licenciaVencimiento)}|"></span></dd>
                        </th:block>
                        <dt class="col-sm-4">Último acceso</dt><dd class="col-sm-8" th:text="${@ui.fecha(usuario.ultimoAcceso)}"></dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Cambiar contraseña</div>
                <div class="card-body">
                    <form th:action="@{/perfil/password}" method="post">
                        <div class="mb-3"><label class="form-label" for="actual">Contraseña actual</label>
                            <input class="form-control" type="password" id="actual" name="actual" required autocomplete="current-password"></div>
                        <div class="mb-3"><label class="form-label" for="nueva">Nueva contraseña (mínimo 6 caracteres)</label>
                            <input class="form-control" type="password" id="nueva" name="nueva" required minlength="6" autocomplete="new-password"></div>
                        <div class="mb-3"><label class="form-label" for="confirmacion">Confirmar nueva contraseña</label>
                            <input class="form-control" type="password" id="confirmacion" name="confirmacion" required minlength="6" autocomplete="new-password"></div>
                        <button class="btn btn-primary">Actualizar contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
