<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title>Almacenes</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div><h1>Almacenes</h1><p class="subtitulo">Ubicaciones donde se guardan los repuestos</p></div>
        <a sec:authorize="hasAuthority('ALMACENES_GESTIONAR')" class="btn btn-primary" th:href="@{/almacenes/nuevo}"><i class="bi bi-plus-lg me-1"></i>Nuevo almacén</a>
    </div>
    <div class="row g-3">
        <div class="col-md-6 col-xl-4" th:each="a : ${almacenes}">
            <a class="card h-100 text-decoration-none text-body" th:href="@{/almacenes/{id}(id=${a.id})}">
                <div class="card-body">
                    <div class="d-flex justify-content-between"><h2 class="h6 fw-bold" th:text="${a.nombre}"></h2>
                        <span class="badge" th:classappend="${a.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${a.activo} ? 'Activo' : 'Inactivo'"></span></div>
                    <p class="small text-muted mb-1"><i class="bi bi-geo me-1"></i><span th:text="${a.ubicacion ?: '-'}"></span></p>
                    <p class="small mb-0"><i class="bi bi-person me-1"></i><span th:text="${a.responsable != null ? a.responsable.nombreCompleto : 'Sin responsable'}"></span></p>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
