# Pruebas: base H2 en memoria (no requiere PostgreSQL)
spring.datasource.url=jdbc:h2:mem:sigem;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
sigem.datos-demo=false
