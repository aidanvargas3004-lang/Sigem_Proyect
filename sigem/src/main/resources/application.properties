# ============================================================
# SIGEM - configuración local por variables de entorno
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigem_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root112233}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

server.port=${SERVER_PORT:8080}
spring.application.name=SIGEM

jwt.secret=${JWT_SECRET:SIGEM-Local-Secret-Change-This-To-A-Long-Random-Secret-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudinary es opcional. Déjalo vacío si no usarás carga de imágenes.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:sigem}

# Carga de imágenes
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Mensajes de validación y formato en español
spring.web.locale=es_PE
spring.web.locale-resolver=fixed

# Respaldos de la base de datos (pg_dump; si no se encuentra se exporta por JDBC)
sigem.backup.dir=${BACKUP_DIR:backups}
sigem.backup.pg-dump=${PG_DUMP:}
sigem.backup.metodo=${BACKUP_METODO:auto}
sigem.backup.retener=${BACKUP_RETENER:15}
sigem.backup.cron=${BACKUP_CRON:0 0 2 * * *}

# Datos de cobro que ve el cliente en "Mis pagos" (valores de ejemplo: reemplácelos por los reales)
sigem.pagos.titular=${PAGOS_TITULAR:TRANSUR S.A.C.}
sigem.pagos.ruc=${PAGOS_RUC:20000000001}
sigem.pagos.banco=${PAGOS_BANCO:BCP}
sigem.pagos.cuenta=${PAGOS_CUENTA:215-0000000-0-00}
sigem.pagos.cci=${PAGOS_CCI:002-215-000000000000-00}
sigem.pagos.yape=${PAGOS_YAPE:999 000 111}
sigem.pagos.plin=${PAGOS_PLIN:999 000 111}
