# ============================================================
# SIGEM - configuración local por variables de entorno
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigem_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root112233}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

server.port=${SERVER_PORT:8080}
spring.application.name=SIGEM

jwt.secret=${JWT_SECRET:SIGEM-Local-Secret-Change-This-To-A-Long-Random-Secret-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudinary es opcional. Déjalo vacío si no usarás carga de imágenes.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:sigem}

# Carga de imágenes
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Mensajes de validación y formato en español
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
