<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vencimientos | SIGEM RRHH</title><th:block th:replace="~{rrhh/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><th:block th:replace="~{rrhh/_nav :: sidebar(${active})}"></th:block><main class="main"><div class="top"><div class="title"><h1>Calendario de Vencimientos</h1><p>Vista cronológica de documentos vencidos y próximos a vencer.</p></div><a class="btnx" th:href="@{/rrhh/alertas}"><i class="bi bi-bell"></i> Ver alertas</a></div><div class="tablewrap"><table><thead><tr><th>Fecha vencimiento</th><th>Colaborador</th><th>Documento</th><th>Días restantes</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="f : ${filas}"><td class="fw-semibold" th:text="${#temporals.format(f.fecha,'dd-MM-yyyy')}">01-09-2026</td><td th:text="${f.empleado}">Juan Pérez Díaz</td><td th:text="${f.documento}">SCTR SALUD</td><td th:text="${f.dias < 0 ? 'Vencido' : f.dias + ' días'}">9 días</td><td><span class="badgex" th:classappend="${f.estado == 'VENCIDO' || f.estado == 'CRÍTICO'} ? ' red' : (${f.estado == 'URGENTE'} ? ' orange' : ' yellow')" th:text="${f.estado}">URGENTE</span></td><td><a class="btnx" th:href="@{/rrhh/documentacion}">Gestionar</a></td></tr><tr th:if="${#lists.isEmpty(filas)}"><td colspan="6" class="empty">No hay vencimientos registrados.</td></tr></tbody></table></div></main></div></body></html>
