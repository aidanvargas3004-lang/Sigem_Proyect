<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Registrar documento | SIGEM</title><th:block th:replace="~{rrhh/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><th:block th:replace="~{rrhh/_nav :: sidebar(${active})}"></th:block><main class="main"><div class="top"><div class="title"><h1>Registrar documento</h1><p>Agrega un documento y su fecha de vencimiento para activar el control de RRHH.</p></div><a class="btnx" th:href="@{/rrhh/documentacion}"><i class="bi bi-arrow-left"></i> Volver</a></div><div th:if="${error}" class="notice err" th:text="${error}"></div><div class="formbox"><form method="post" th:action="@{/rrhh/documentacion/guardar}" th:object="${documentoRequest}"><div class="formgrid"><div class="field full"><label>Colaborador</label><select th:field="*{empleadoId}" required><option value="">Seleccione...</option><option th:each="e : ${empleados}" th:value="${e.id}" th:text="${e.nombres + ' ' + e.apellidos + ' — ' + e.documento}"></option></select></div><div class="field"><label>Tipo de documento</label><input th:field="*{tipoDocumento}" placeholder="LICENCIA_AIII_C / SCTR_SALUD / CERTIFICACION_EXCAVADORA" required></div><div class="field"><label>Número de documento</label><input th:field="*{numeroDocumento}"></div><div class="field"><label>Fecha de emisión</label><input type="date" th:field="*{fechaEmision}" required></div><div class="field"><label>Fecha de vencimiento</label><input type="date" th:field="*{fechaVencimiento}" required></div><div class="field full"><label>URL del archivo <span class="small-muted">(opcional, por ejemplo Cloudinary)</span></label><input th:field="*{rutaArchivo}" placeholder="https://..."></div></div><div class="actions"><a class="btnx" th:href="@{/rrhh/documentacion}">Cancelar</a><button class="btnx blue" type="submit"><i class="bi bi-check2"></i> Registrar documento</button></div></form></div></main></div></body></html>
