<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Alertas | SIGEM RRHH</title><th:block th:replace="~{rrhh/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><th:block th:replace="~{rrhh/_nav :: sidebar(${active})}"></th:block><main class="main"><div class="top"><div class="title"><h1>Historial de Alertas Automáticas</h1><p>Registro de notificaciones generadas por SIGEM para seguimiento de RRHH.</p></div><a class="btnx" th:href="@{/rrhh/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></div><div class="tablewrap"><table><thead><tr><th>Fecha / Hora</th><th>Tipo alerta</th><th>Destinatario</th><th>Mensaje</th><th>Estado lectura</th></tr></thead><tbody><tr th:each="n : ${notificaciones}"><td class="small-muted" th:text="${n.fecha != null ? #temporals.format(n.fecha,'dd-MM-yyyy HH:mm') : '-'}">27-09-2026 08:00</td><td><span class="badgex" th:classappend="${n.tipo == 'ERROR'} ? ' red' : (${n.tipo == 'WARNING'} ? ' orange' : ' blue')" th:text="${n.titulo}">VENCIMIENTO DE DOCUMENTO</span></td><td th:text="${n.usuario != null ? 'Usuario #' + n.usuario.id : 'Sistema / General'}">RRHH</td><td th:text="${n.mensaje}">Documento próximo a vencer.</td><td><span class="badgex" th:classappend="${n.leida} ? ' green' : ' orange'" th:text="${n.leida} ? 'Leído' : 'Pendiente'">Pendiente</span></td></tr><tr th:if="${#lists.isEmpty(notificaciones)}"><td colspan="5" class="empty">Todavía no existen notificaciones.</td></tr></tbody></table></div></main></div></body></html>
