<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Personal | SIGEM RRHH</title><th:block th:replace="~{rrhh/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><th:block th:replace="~{rrhh/_nav :: sidebar(${active})}"></th:block><main class="main"><div class="top"><div class="title"><h1>Plantel de Empleados</h1><p>Listado maestro del personal con su estado general de habilitación.</p></div><a class="btnx blue" th:href="@{/rrhh/empleados/nuevo}"><i class="bi bi-person-plus"></i> Nuevo empleado</a></div><div th:if="${success}" class="notice ok" th:text="${success}"></div><div class="toolbar"><form class="search" method="get" th:action="@{/rrhh/empleados}"><input name="q" th:value="${q}" placeholder="Buscar por DNI, nombre, apellido o cargo..."><button class="btnx" type="submit"><i class="bi bi-search"></i> Buscar</button></form><form method="get" th:action="@{/rrhh/empleados}"><select name="cargo" onchange="this.form.submit()" class="btnx"><option value="">Todos los cargos</option><option th:each="c : ${cargos}" th:value="${c}" th:text="${c}" th:selected="${c == cargo}"></option></select></form></div><div class="tablewrap"><table><thead><tr><th>DNI</th><th>Nombres y Apellidos</th><th>Cargo</th><th>Teléfono</th><th>Documentos</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="e : ${empleados}"><td class="fw-semibold" th:text="${e.documento}">40123456</td><td><div class="profile-head"><div class="avatar" th:text="${#strings.substring(e.nombres,0,1)}">C</div><div><div class="fw-bold" th:text="${e.nombres + ' ' + e.apellidos}">Carlos Pérez</div><div class="small-muted" th:text="${e.email ?: 'Sin correo'}">correo@empresa.com</div></div></div></td><td th:text="${e.cargo}">Operador Excavadora</td><td th:text="${e.telefono ?: '-'}">999999999</td><td><span class="badgex blue" th:text="${e.cantidadDocumentos}">3</span></td><td><span class="badgex" th:classappend="${e.estado} ? ' green' : ' red'" th:text="${e.estado} ? 'HABILITADO' : 'INACTIVO'">HABILITADO</span></td><td><div class="d-flex gap-1"><a class="btnx" th:href="@{/rrhh/documentacion(empleadoId=${e.id})}">Ver docs</a><form method="post" th:action="@{/rrhh/empleados/{id}/estado(id=${e.id})}"><input type="hidden" name="estado" th:value="${!e.estado}"><button class="btnx" type="submit" th:text="${e.estado} ? 'Deshabilitar' : 'Habilitar'"></button></form></div></td></tr><tr th:if="${#lists.isEmpty(empleados)}"><td colspan="7" class="empty">No se encontraron empleados.</td></tr></tbody></table></div></main></div></body></html>
