<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nuevo empleado | SIGEM</title><th:block th:replace="~{rrhh/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><th:block th:replace="~{rrhh/_nav :: sidebar(${active})}"></th:block><main class="main"><div class="top"><div class="title"><h1>Registrar empleado</h1><p>Alta de personal para RRHH y módulos operativos.</p></div><a class="btnx" th:href="@{/rrhh/empleados}"><i class="bi bi-arrow-left"></i> Volver</a></div><div th:if="${error}" class="notice err" th:text="${error}"></div><div class="formbox"><form method="post" th:action="@{/rrhh/empleados/guardar}" th:object="${empleadoRequest}"><div class="formgrid"><div class="field"><label>DNI / Documento</label><input th:field="*{documento}" required><div class="text-danger small" th:errors="*{documento}"></div></div><div class="field"><label>Fecha de ingreso</label><input type="date" th:field="*{fechaIngreso}" required><div class="text-danger small" th:errors="*{fechaIngreso}"></div></div><div class="field"><label>Nombres</label><input th:field="*{nombres}" required></div><div class="field"><label>Apellidos</label><input th:field="*{apellidos}" required></div><div class="field"><label>Cargo</label><input th:field="*{cargo}" placeholder="CONDUCTOR, OPERADOR, TECNICO..."></div><div class="field"><label>Teléfono</label><input th:field="*{telefono}"></div><div class="field"><label>Correo electrónico</label><input type="email" th:field="*{email}"></div><div class="field"><label>ID usuario del sistema <span class="small-muted">(opcional)</span></label><input type="number" th:field="*{usuarioId}"></div></div><div class="actions"><a class="btnx" th:href="@{/rrhh/empleados}">Cancelar</a><button class="btnx blue" type="submit"><i class="bi bi-check2"></i> Guardar empleado</button></div></form></div></main></div></body></html>
