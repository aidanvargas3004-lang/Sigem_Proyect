<th:block th:fragment="campana">
<a th:if="${notifPendientes != null}" th:href="@{/notificaciones}" title="Notificaciones"
   style="position:fixed;right:22px;bottom:22px;z-index:1200;width:52px;height:52px;border-radius:50%;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(15,23,42,.25);text-decoration:none;font-size:22px">
  <i class="bi bi-bell-fill"></i>
  <span th:if="${notifPendientes > 0}" th:text="${notifPendientes > 99 ? '99+' : notifPendientes}"
        style="position:absolute;top:-3px;right:-3px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff">3</span>
</a>
</th:block>
