<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes Completos - SIGEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { min-height: 100vh; background: #1e293b; color: white; width: 260px; position: fixed; left: 0; top: 0; z-index: 1000; }
        .sidebar .nav-link { color: #94a3b8; padding: 12px 20px; border-left: 3px solid transparent; transition: all 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background: #334155; border-left-color: #3b82f6; }
        .main-content { margin-left: 260px; padding: 2rem; }
        .card-chart { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 1.5rem; border: none; height: 500px; }
    </style>
</head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>

<!-- SIDEBAR -->
<nav class="sidebar p-3">
    <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <i class="bi bi-box-seam-fill fs-3 text-primary"></i>
        <h4 class="m-0 fw-bold">SIGEM</h4>
    </div>
    <ul class="nav flex-column gap-1">
        <li class="nav-item"><a class="nav-link" th:href="@{/marketing/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/marketing/campanias}"><i class="bi bi-megaphone"></i> Campañas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/marketing/leads}"><i class="bi bi-person-lines-fill"></i> Leads</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/marketing/oportunidades}"><i class="bi bi-funnel"></i> Oportunidades</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/marketing/clientes}"><i class="bi bi-building"></i> Clientes</a></li>
        <li class="nav-item"><a class="nav-link active" th:href="@{/marketing/reportes}"><i class="bi bi-bar-chart-line"></i> Reportes</a></li>
    </ul>
    <form th:action="@{/logout}" method="post" class="mt-3 px-2">
        <button type="submit" class="btn btn-outline-light w-100 text-start">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
        </button>
    </form>
</nav>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold m-0"><i class="bi bi-graph-up-arrow text-primary me-2"></i>Reporte Integral de Marketing</h2>
            <p class="text-muted small mb-0">Visión completa del embudo: Leads → Oportunidades → Clientes</p>
        </div>
        <div class="btn-group shadow-sm">
            <a th:href="@{/marketing/reportes/exportar/excel}" class="btn btn-success btn-sm d-flex align-items-center gap-2">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </a>
            <a th:href="@{/marketing/reportes/exportar/pdf}" class="btn btn-danger btn-sm d-flex align-items-center gap-2">
                <i class="bi bi-file-earmark-pdf"></i> PDF
            </a>
        </div>
    </div>

    <!-- GRÁFICO COMPLETO -->
    <div class="card card-chart mb-4">
        <canvas id="fullMarketingChart"></canvas>
    </div>

    <!-- TARJETAS DE RESUMEN RÁPIDO (Opcional pero útil) -->
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card p-3 border-0 shadow-sm text-center">
                <h6 class="text-muted text-uppercase small">Total Leads (Año)</h6>
                <h3 class="text-primary mb-0" th:text="${#aggregates.sum(reporte.![leads])}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 border-0 shadow-sm text-center">
                <h6 class="text-muted text-uppercase small">Total Oportunidades</h6>
                <h3 class="text-warning mb-0" th:text="${#aggregates.sum(reporte.![oportunidadesCreadas])}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 border-0 shadow-sm text-center">
                <h6 class="text-muted text-uppercase small">Pipeline Total (S/)</h6>
                <h3 class="text-success mb-0" th:text="${'S/ ' + #numbers.formatDecimal(#aggregates.sum(reporte.![montoPipeline]),1,0)}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 border-0 shadow-sm text-center">
                <h6 class="text-muted text-uppercase small">Clientes Nuevos</h6>
                <h3 class="text-info mb-0" th:text="${#aggregates.sum(reporte.![clientesNuevos])}">0</h3>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const data = /*[[${reporte}]]*/ [];

    const labels = data.map(r => r.mes);
    const leads = data.map(r => r.leads);
    const opps = data.map(r => r.oportunidadesCreadas);
    const clientes = data.map(r => r.clientesNuevos);
    const monto = data.map(r => r.montoPipeline);

    new Chart(document.getElementById('fullMarketingChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Leads Captados',
                    data: leads,
                    backgroundColor: '#3b82f6', // Azul
                    borderRadius: 4,
                    order: 4
                },
                {
                    label: 'Oportunidades Creadas',
                    data: opps,
                    backgroundColor: '#f59e0b', // Naranja/Amarillo
                    borderRadius: 4,
                    order: 3
                },
                {
                    label: 'Clientes Nuevos',
                    data: clientes,
                    backgroundColor: '#10b981', // Verde
                    borderRadius: 4,
                    order: 2
                },
                {
                    label: 'Valor Pipeline (S/)',
                    data: monto,
                    type: 'line',
                    borderColor: '#6366f1', // Índigo
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    borderWidth: 3,
                    pointRadius: 4,
                    yAxisID: 'y1',
                    tension: 0.4,
                    fill: true,
                    order: 1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top' },
                tooltip: {
                    backgroundColor: 'rgba(30, 41, 59, 0.95)',
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) label += ': ';
                            if (context.dataset.yAxisID === 'y1') {
                                label += 'S/ ' + context.parsed.y.toLocaleString();
                            } else {
                                label += context.parsed.y;
                            }
                            return label;
                        }
                    }
                }
            },
            scales: {
                x: { grid: { display: false } },
                y: {
                    beginAtZero: true,
                    grid: { color: '#f1f5f9' },
                    title: { display: true, text: 'Cantidad (Unidades)' }
                },
                y1: {
                    position: 'right',
                    beginAtZero: true,
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: 'Monto (Soles)' },
                    ticks: { callback: (val) => 'S/ ' + (val/1000) + 'k' }
                }
            }
        }
    });
    /*]]>*/
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
