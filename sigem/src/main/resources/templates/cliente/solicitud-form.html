<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva solicitud - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><th:block th:replace="~{cliente/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{cliente/_nav :: sidebar('solicitudes')}"></div><main class="main"><div class="top"><div class="title"><h1>Nueva solicitud</h1><p>Cuéntanos qué maquinaria o servicio necesitas.</p></div></div><section class="panel"><form th:action="@{/cliente/solicitudes}" method="post"><div class="formgrid"><div><label class="label">Tipo de solicitud</label><select class="form-select" name="tipoSolicitud" required><option value="ALQUILER">Alquiler de maquinaria</option><option value="SERVICIO">Servicio con maquinaria</option><option value="VENTA">Compra de maquinaria</option></select></div><div><label class="label">Cliente</label><input class="form-control" th:value="${cliente.razonSocial}" disabled></div><div class="full"><label class="label">Describe tu necesidad</label><textarea class="form-control" name="descripcion" rows="6" required placeholder="Ej.: Necesito una excavadora para movimiento de tierras durante 5 días..."></textarea></div></div><div style="margin-top:20px;display:flex;gap:10px"><a class="btnx secondary" th:href="@{/cliente/solicitudes}">Cancelar</a><button class="btnx" type="submit">Enviar solicitud</button></div></form></section></main></div></body></html>
