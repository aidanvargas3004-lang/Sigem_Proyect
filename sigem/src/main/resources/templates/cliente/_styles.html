<th:block th:fragment="styles">
<style>
:root{--nav:#0f172a;--primary:#2563eb;--bg:#f8fafc;--text:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text)}.layout{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--nav);padding:24px 16px;color:#fff}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 28px;font-weight:800;font-size:22px}.brand i{font-size:28px;color:#60a5fa}.navx{display:grid;gap:6px}.navx a{color:#cbd5e1;text-decoration:none;padding:12px 14px;border-radius:10px}.navx a:hover,.navx a.active{background:#1e293b;color:#fff}.navx i{margin-right:10px}.main{margin-left:250px;padding:32px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:30px}.title p{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.cardx,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(15,23,42,.04)}.metric small{color:var(--muted);text-transform:uppercase;font-weight:700;font-size:12px}.metric strong{display:block;font-size:30px;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{margin-bottom:20px}.btnx{display:inline-flex;align-items:center;gap:7px;background:var(--primary);color:#fff;text-decoration:none;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btnx.secondary{background:#e2e8f0;color:#0f172a}.tablewrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px}.tablex{width:100%;border-collapse:collapse}.tablex th,.tablex td{padding:13px 14px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}.tablex th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#f8fafc}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:700}.notice{padding:12px 14px;border-radius:10px;margin-bottom:18px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.formgrid .full{grid-column:1/-1}.form-control,.form-select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px}.label{font-size:13px;font-weight:700;margin-bottom:6px;display:block}.muted{color:var(--muted)}@media(max-width:900px){.sidebar{position:static;width:auto}.main{margin-left:0;padding:18px}.cards,.grid2,.formgrid{grid-template-columns:1fr}.top{display:block}.top .btnx{margin-top:15px}}
</style>
</th:block>
