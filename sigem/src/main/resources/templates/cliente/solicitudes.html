<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis solicitudes - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><th:block th:replace="~{cliente/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{cliente/_nav :: sidebar('solicitudes')}"></div><main class="main"><div th:if="${success}" class="notice ok" th:text="${success}"></div><div th:if="${error}" class="notice err" th:text="${error}"></div><div class="top"><div class="title"><h1>Mis solicitudes</h1><p>Solicita una venta, alquiler o servicio.</p></div><a class="btnx" th:href="@{/cliente/solicitudes/nueva}"><i class="bi bi-plus-lg"></i>Nueva solicitud</a></div><div class="tablewrap"><table class="tablex"><thead><tr><th>#</th><th>Tipo</th><th>Descripción</th><th>Fecha</th><th>Estado</th></tr></thead><tbody><tr th:each="s:${solicitudes}"><td th:text="${'SOL-' + s.id}">SOL-1</td><td th:text="${s.tipoSolicitud}">SERVICIO</td><td th:text="${s.descripcion}">Descripción</td><td th:text="${#temporals.format(s.fechaSolicitud,'dd/MM/yyyy HH:mm')}">01/01/2026</td><td><span class="badge" th:text="${s.estado}">PENDIENTE</span></td></tr><tr th:if="${#lists.isEmpty(solicitudes)}"><td colspan="5" class="muted">No tienes solicitudes.</td></tr></tbody></table></div></main></div></body></html>
