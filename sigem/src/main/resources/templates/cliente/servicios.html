<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servicios y alquileres - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><th:block th:replace="~{cliente/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{cliente/_nav :: sidebar('servicios')}"></div><main class="main"><div class="top"><div class="title"><h1>Servicios y alquileres</h1><p>Seguimiento de la ejecución posterior al contrato.</p></div></div><div class="grid2"><section class="panel"><h3>Servicios</h3><div class="tablewrap"><table class="tablex"><thead><tr><th>Contrato</th><th>Tipo</th><th>Fecha</th><th>Estado</th></tr></thead><tbody><tr th:each="s:${servicios}"><td th:text="${s.contrato.numero}">CTR-001</td><td th:text="${s.tipoServicio.nombre}">MOVIMIENTO_TIERRA</td><td th:text="${#temporals.format(s.fechaProgramada,'dd/MM/yyyy HH:mm')}">01/01/2026</td><td><span class="badge" th:text="${s.estado}">POR_ASIGNAR</span></td></tr><tr th:if="${#lists.isEmpty(servicios)}"><td colspan="4" class="muted">No tienes servicios registrados.</td></tr></tbody></table></div></section><section class="panel"><h3>Alquileres</h3><div class="tablewrap"><table class="tablex"><thead><tr><th>Contrato</th><th>Estado</th><th>Inicio real</th></tr></thead><tbody><tr th:each="a:${alquileres}"><td th:text="${a.contrato.numero}">CTR-001</td><td><span class="badge" th:text="${a.estado}">PROGRAMADO</span></td><td th:text="${a.fechaInicioReal != null ? #temporals.format(a.fechaInicioReal,'dd/MM/yyyy HH:mm') : '-'}">-</td></tr><tr th:if="${#lists.isEmpty(alquileres)}"><td colspan="3" class="muted">No tienes alquileres registrados.</td></tr></tbody></table></div></section></div></main></div></body></html>
