<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis cotizaciones - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><th:block th:replace="~{cliente/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{cliente/_nav :: sidebar('cotizaciones')}"></div><main class="main"><div th:if="${success}" class="notice ok" th:text="${success}"></div><div th:if="${error}" class="notice err" th:text="${error}"></div><div class="top"><div class="title"><h1>Mis cotizaciones</h1><p>Revisa precios y responde las cotizaciones enviadas por Ventas.</p></div></div><div class="tablewrap"><table class="tablex"><thead><tr><th>Número</th><th>Solicitud</th><th>Fecha</th><th>Total</th><th>Vigencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="c:${cotizaciones}"><td th:text="${c.numero}">COT-001</td><td><div class="fw-semibold" th:text="${c.solicitudId == null ? '-' : 'SOL-' + c.solicitudId}">SOL-1</div><small class="muted" th:text="${c.solicitud != null ? c.solicitud.descripcion : '-'}">-</small></td><td th:text="${#temporals.format(c.fechaEmision,'dd/MM/yyyy')}">01/01/2026</td><td th:text="${'S/ ' + #numbers.formatDecimal(c.total,1,2)}">S/ 0.00</td><td th:text="${c.vigencia != null ? #temporals.format(c.vigencia,'dd/MM/yyyy') : '-'}">-</td><td><span class="badge" th:text="${c.estado}">ENVIADA</span></td><td><div th:if="${c.estado == 'ENVIADA'}" style="display:flex;gap:6px"><form th:action="@{/cliente/cotizaciones/{id}/respuesta(id=${c.id})}" method="post"><input type="hidden" name="respuesta" value="APROBAR"><button class="btnx" type="submit">Aprobar</button></form><form th:action="@{/cliente/cotizaciones/{id}/respuesta(id=${c.id})}" method="post"><input type="hidden" name="respuesta" value="RECHAZAR"><button class="btnx secondary" type="submit">Rechazar</button></form></div><span th:if="${c.estado != 'ENVIADA'}" class="muted">Sin acciones</span></td></tr><tr th:if="${#lists.isEmpty(cotizaciones)}"><td colspan="7" class="muted">No tienes cotizaciones.</td></tr></tbody></table></div></main></div></body></html>
