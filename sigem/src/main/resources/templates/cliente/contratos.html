<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis contratos - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><th:block th:replace="~{cliente/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{cliente/_nav :: sidebar('contratos')}"></div><main class="main"><div class="top"><div class="title"><h1>Mis contratos</h1><p>Consulta los acuerdos generados a partir de cotizaciones aprobadas.</p></div></div><div class="tablewrap"><table class="tablex"><thead><tr><th>Número</th><th>Cotización</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Monto</th><th>Saldo</th><th>Estado</th></tr></thead><tbody><tr th:each="c:${contratos}"><td th:text="${c.numero}">CTR-001</td><td><span class="badge" th:text="${c.cotizacion == null ? '-' : c.cotizacion.numero}">COT-001</span></td><td th:text="${c.tipoContrato}">ALQUILER</td><td th:text="${#temporals.format(c.fechaInicio,'dd/MM/yyyy')}">01/01/2026</td><td th:text="${c.fechaFin != null ? #temporals.format(c.fechaFin,'dd/MM/yyyy') : '-'}">-</td><td th:text="${'S/ ' + #numbers.formatDecimal(c.montoTotal,1,2)}">S/ 0.00</td><td><a th:href="@{/cliente/pagos}" th:text="${c.estado == 'CANCELADO' ? '-' : 'S/ ' + #numbers.formatDecimal(resumenes[c.id].saldo,1,2)}">S/ 0.00</a></td><td><span class="badge" th:text="${c.estado}">VIGENTE</span></td></tr><tr th:if="${#lists.isEmpty(contratos)}"><td colspan="8" class="muted">No tienes contratos.</td></tr></tbody></table></div></main></div></body></html>
