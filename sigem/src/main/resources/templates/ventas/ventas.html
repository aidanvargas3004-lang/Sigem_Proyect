<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventas - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:#f8fafc;font-family:'Segoe UI',system-ui,sans-serif;margin:0}.sidebar{min-height:100vh;background:#1e293b;color:#fff;width:260px;position:fixed;left:0;top:0;bottom:0;z-index:1000;overflow-y:auto}.sidebar .nav-link{color:#94a3b8;padding:11px 18px;border-left:3px solid transparent;display:flex;align-items:center;transition:.2s}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:#334155;border-left-color:#3b82f6}.sidebar .nav-link i{width:24px;margin-right:8px}.ventas-brand-icon{width:42px;height:42px;border-radius:12px;background:rgba(59,130,246,.14);display:grid;place-items:center;color:#60a5fa;font-size:21px}.ventas-main{margin-left:260px;padding:30px;min-height:100vh}.card{border:0;border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.05)}@media(max-width:700px){.sidebar{position:relative;width:100%;min-height:auto}.ventas-main{margin-left:0;padding:20px}}
</style>
</head><body class="bg-light"><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div th:replace="~{ventas/_nav :: sidebar('ventas')}"></div><main class="ventas-main"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="fw-bold">Ventas de maquinaria</h1><p class="text-secondary">Transferencias generadas desde contratos de venta aprobados.</p></div><div><a class="btn btn-outline-secondary me-2" href="/ventas/dashboard">Ventas</a><a class="btn btn-primary" href="/ventas/ventas/nueva">Registrar venta</a></div></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card shadow-sm border-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Número</th><th>Contrato</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead><tbody><tr th:each="v:${ventas}"><td th:text="${v.numero}">VTA-001</td><td th:text="${v.contrato.numero}">CTR-001</td><td th:text="${v.contrato.cliente.razonSocial}">Cliente</td><td th:text="${v.fechaVenta}">2026-01-01</td><td th:text="${'S/ ' + v.totalFinal}">S/ 0</td><td th:text="${v.estado}">COMPLETADA</td></tr><tr th:if="${#lists.isEmpty(ventas)}"><td colspan="6" class="text-center text-secondary py-5">No hay ventas.</td></tr></tbody></table></div></div></main></body></html>
