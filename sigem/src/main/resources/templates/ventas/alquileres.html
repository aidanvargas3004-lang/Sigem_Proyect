<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alquileres - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:#f8fafc;font-family:'Segoe UI',system-ui,sans-serif;margin:0}.sidebar{min-height:100vh;background:#1e293b;color:#fff;width:260px;position:fixed;left:0;top:0;bottom:0;z-index:1000;overflow-y:auto}.sidebar .nav-link{color:#94a3b8;padding:11px 18px;border-left:3px solid transparent;display:flex;align-items:center;transition:.2s}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:#334155;border-left-color:#3b82f6}.sidebar .nav-link i{width:24px;margin-right:8px}.ventas-brand-icon{width:42px;height:42px;border-radius:12px;background:rgba(59,130,246,.14);display:grid;place-items:center;color:#60a5fa;font-size:21px}.ventas-main{margin-left:260px;padding:30px;min-height:100vh}.card{border:0;border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.05)}@media(max-width:700px){.sidebar{position:relative;width:100%;min-height:auto}.ventas-main{margin-left:0;padding:20px}}
</style>
</head><body class="bg-light"><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div th:replace="~{ventas/_nav :: sidebar('alquileres')}"></div><main class="ventas-main"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="fw-bold">Alquileres</h1><p class="text-secondary">Ejecución del contrato de alquiler y liberación de maquinaria.</p></div><div><a class="btn btn-outline-secondary me-2" href="/ventas/dashboard">Ventas</a><a class="btn btn-primary" href="/ventas/alquileres/nuevo">Nuevo alquiler</a></div></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card shadow-sm border-0"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Contrato</th><th>Cliente</th><th>Inicio</th><th>Fin</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="a:${alquileres}"><td th:text="${a.contrato.numero}">CTR-001</td><td th:text="${a.contrato.cliente.razonSocial}">Cliente</td><td th:text="${a.fechaInicioReal}">-</td><td th:text="${a.fechaFinReal ?: '-'}">-</td><td><span class="badge text-bg-primary" th:text="${a.estado}">EN_CURSO</span></td><td><form th:if="${a.estado != 'FINALIZADO' && a.estado != 'CANCELADO'}" th:action="@{/ventas/alquileres/{id}/finalizar(id=${a.id})}" method="post"><button class="btn btn-sm btn-outline-success">Finalizar</button></form></td></tr><tr th:if="${#lists.isEmpty(alquileres)}"><td colspan="6" class="text-center text-secondary py-5">No hay alquileres.</td></tr></tbody></table></div></div></main></body></html>
