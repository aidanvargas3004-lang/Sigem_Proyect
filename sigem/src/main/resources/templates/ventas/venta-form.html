<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva venta - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body{background:#f8fafc;font-family:'Segoe UI',system-ui,sans-serif;margin:0}.sidebar{min-height:100vh;background:#1e293b;color:#fff;width:260px;position:fixed;left:0;top:0;bottom:0;z-index:1000;overflow-y:auto}.sidebar .nav-link{color:#94a3b8;padding:11px 18px;border-left:3px solid transparent;display:flex;align-items:center;transition:.2s}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:#334155;border-left-color:#3b82f6}.sidebar .nav-link i{width:24px;margin-right:8px}.ventas-brand-icon{width:42px;height:42px;border-radius:12px;background:rgba(59,130,246,.14);display:grid;place-items:center;color:#60a5fa;font-size:21px}.ventas-main{margin-left:260px;padding:30px;min-height:100vh}.card{border:0;border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.05)}@media(max-width:700px){.sidebar{position:relative;width:100%;min-height:auto}.ventas-main{margin-left:0;padding:20px}}
</style>
</head><body class="bg-light"><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div th:replace="~{ventas/_nav :: sidebar('ventas')}"></div><main class="ventas-main"><div class="card shadow-sm border-0 mx-auto" style="max-width:900px"><div class="card-body p-4"><h1 class="fw-bold">Registrar venta</h1><p class="text-secondary">La maquinaria seleccionada pasará a estado VENDIDO.</p><form th:action="@{/ventas/ventas}" method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Contrato</label><select class="form-select" name="contratoId" required><option value="">Seleccione...</option><option th:each="c:${contratos}" th:value="${c.id}" th:text="${c.numero + ' · ' + c.clienteNombre + ' · S/ ' + c.montoTotal}">CTR-001</option></select></div><div class="col-md-6"><label class="form-label">Número de venta</label><input class="form-control" name="numero" placeholder="VTA-2026-001" required></div><div class="col-md-6"><label class="form-label">Maquinaria</label><select class="form-select" name="detalles[0].maquinariaId" required><option value="">Seleccione...</option><option th:each="m:${maquinarias}" th:value="${m.id}" th:text="${m.codigoInterno + ' · ' + m.marca + ' ' + m.modelo}">EXC-001</option></select></div><div class="col-md-6"><label class="form-label">Precio final</label><input class="form-control" name="detalles[0].precioFinal" type="number" step="0.01" min="0.01" required></div><div class="col-md-6"><label class="form-label">Cantidad</label><input class="form-control" name="detalles[0].cantidad" type="number" min="1" value="1" required></div><div class="col-12 d-flex gap-2"><a class="btn btn-outline-secondary" href="/ventas/ventas">Cancelar</a><button class="btn btn-primary">Registrar venta</button></div></form></div></div></main></body></html>
