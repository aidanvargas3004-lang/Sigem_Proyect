<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nuevo contrato - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><style>body{background:#f8fafc}.sidebar{min-height:100vh;background:#1e293b;color:#fff;width:260px;position:fixed}.sidebar .nav-link{color:#94a3b8;padding:11px 18px}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:#334155}.main{margin-left:260px;padding:30px}.card{border:0;border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.05)}.summary{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px}</style></head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div th:replace="~{ventas/_nav :: sidebar('contratos')}"></div>
<main class="main"><div class="mb-4"><a th:href="@{/ventas/contratos}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Volver a contratos</a><h2 class="fw-bold mt-2">Nuevo contrato</h2><p class="text-muted">Selecciona una cotización aprobada. El monto se toma automáticamente de la cotización.</p></div>
<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>
<div class="card p-4"><form th:action="@{/ventas/contratos}" th:object="${contrato}" method="post">
<div class="row g-4"><div class="col-md-8"><label class="form-label fw-semibold">Cotización aprobada *</label><select id="cotizacion" class="form-select" th:field="*{cotizacionId}" required><option value="">Seleccione una cotización...</option><option th:each="c : ${cotizaciones}" th:value="${c.id}" th:selected="${contrato.cotizacionId != null and contrato.cotizacionId == c.id}" th:data-tipo="${c.solicitud.tipoSolicitud}" th:data-cliente="${c.cliente.razonSocial}" th:data-total="${c.total}" th:text="${c.numero + ' - ' + c.cliente.razonSocial + ' - S/ ' + c.total}"></option></select><div class="text-danger small" th:if="${#fields.hasErrors('cotizacionId')}" th:errors="*{cotizacionId}"></div></div>
<div class="col-md-4"><label class="form-label fw-semibold">Número de contrato</label><input class="form-control" th:field="*{numero}" placeholder="Automático: CTR-2026-001"><small class="text-muted">Déjalo vacío para generar el número automáticamente.</small></div>
<div class="col-md-4"><label class="form-label fw-semibold">Tipo *</label><select id="tipo" class="form-select" th:field="*{tipoContrato}" required><option value="">Seleccione...</option><option value="VENTA">VENTA</option><option value="ALQUILER">ALQUILER</option><option value="SERVICIO">SERVICIO</option></select></div>
<div class="col-md-4"><label class="form-label fw-semibold">Fecha inicio *</label><input id="inicio" type="date" class="form-control" th:field="*{fechaInicio}" required></div>
<div class="col-md-4"><label class="form-label fw-semibold">Fecha fin</label><input id="fin" type="date" class="form-control" th:field="*{fechaFin}"><small id="finHelp" class="text-muted">No aplica para contratos de venta.</small></div></div>
<div id="resumen" class="summary p-3 mt-4 d-none"><div class="row"><div class="col-md-4"><small class="text-muted">Cliente</small><div id="clienteResumen" class="fw-semibold">-</div></div><div class="col-md-4"><small class="text-muted">Tipo según solicitud</small><div id="tipoResumen" class="fw-semibold">-</div></div><div class="col-md-4"><small class="text-muted">Monto cotizado</small><div id="montoResumen" class="fw-bold text-primary">S/ 0.00</div></div></div></div>
<div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top"><a class="btn btn-light" th:href="@{/ventas/contratos}">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Crear contrato</button></div></form></div></main>
<script>const c=document.getElementById('cotizacion'),t=document.getElementById('tipo'),fin=document.getElementById('fin'),inicio=document.getElementById('inicio');function sync(){const o=c.options[c.selectedIndex];if(o&&o.value){document.getElementById('resumen').classList.remove('d-none');document.getElementById('clienteResumen').textContent=o.dataset.cliente||'-';document.getElementById('tipoResumen').textContent=o.dataset.tipo||'-';document.getElementById('montoResumen').textContent='S/ '+Number(o.dataset.total||0).toLocaleString('es-PE',{minimumFractionDigits:2});t.value=o.dataset.tipo||'';} else document.getElementById('resumen').classList.add('d-none');const venta=t.value==='VENTA';fin.disabled=venta;fin.required=!venta;if(venta)fin.value='';}c.addEventListener('change',sync);t.addEventListener('change',sync);inicio.addEventListener('change',()=>{fin.min=inicio.value});sync();fin.min=inicio.value;</script></body></html>
