<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar contrato - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f8fafc}.sidebar{min-height:100vh;background:#1e293b;color:#fff;width:260px;position:fixed}.sidebar .nav-link{color:#94a3b8;padding:11px 18px}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:#334155}.main{margin-left:260px;padding:30px}.card{border:0;border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.05)}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"></head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div th:replace="~{ventas/_nav :: sidebar('contratos')}"></div>
<main class="main"><a th:href="@{/ventas/contratos/{id}(id=${contratoId})}" class="text-decoration-none">← Volver al contrato</a><h2 class="fw-bold mt-2">Editar contrato</h2><p class="text-muted">Cotización vinculada: <strong th:text="${cotizacionNumero}">COT-2026-001</strong></p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card p-4"><form th:action="@{/ventas/contratos/{id}/editar(id=${contratoId})}" th:object="${contrato}" method="post"><input type="hidden" th:field="*{cotizacionId}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Número</label><input class="form-control" th:field="*{numero}" required></div><div class="col-md-4"><label class="form-label">Tipo</label><select class="form-select" th:field="*{tipoContrato}" required><option value="VENTA">VENTA</option><option value="ALQUILER">ALQUILER</option><option value="SERVICIO">SERVICIO</option></select></div><div class="col-md-4"><label class="form-label">Fecha inicio</label><input class="form-control" type="date" th:field="*{fechaInicio}" required></div><div class="col-md-4"><label class="form-label">Fecha fin</label><input class="form-control" type="date" th:field="*{fechaFin}"></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/ventas/contratos/{id}(id=${contratoId})}">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form></div></main></body></html>
