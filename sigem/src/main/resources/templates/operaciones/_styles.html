<th:block th:fragment="styles">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
:root{--primary:#3b82f6;--sidebar:#1e293b;--sidebar-hover:#334155;--muted:#64748b;--ink:#1e293b;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px}
.layout{display:flex;min-height:100vh}
.sidebar{min-height:100vh;background:var(--sidebar);color:#fff;width:260px;position:fixed;left:0;top:0;bottom:0;z-index:1000;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:24px 18px 22px;margin:0 8px 12px;border-bottom:1px solid rgba(148,163,184,.15);text-align:left;font-weight:800;letter-spacing:.1px;line-height:1.15;color:#fff}
.brand .brand-icon{width:42px;height:42px;border-radius:12px;background:rgba(59,130,246,.14);display:grid;place-items:center;color:#60a5fa;font-size:21px;flex:none}
.brand .brand-text{font-size:19px;line-height:1.05}
.brand small{display:block;font-size:11px;color:#94a3b8;margin-top:5px;font-weight:500;letter-spacing:.2px}
.navx{padding:0 8px}.navx a{display:flex;align-items:center;gap:12px;margin:2px 0;padding:11px 14px;border-left:3px solid transparent;border-radius:7px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;transition:.2s;background:transparent}
.navx a:hover,.navx a.active{color:#fff;background:var(--sidebar-hover);border-left-color:var(--primary)}
.navx a.active{font-weight:600}.navx i{width:19px;text-align:center;font-size:16px;margin-right:0}
.main{margin-left:260px;width:calc(100% - 260px);padding:32px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.title h1{font-size:27px;margin:0 0 5px;font-weight:700;color:#172033}.title p{margin:0;color:var(--muted);font-size:14px}
.btnx{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #cbd5e1;background:#fff;color:#334155;padding:9px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;transition:.2s;white-space:nowrap}.btnx:hover{background:#f1f5f9;color:#0f172a}.btnx.dark{background:var(--primary);border-color:var(--primary);color:#fff}.btnx.dark:hover{background:#2563eb;color:#fff}.btnx.blue{background:var(--primary);border-color:var(--primary);color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:25px}.card{background:#fff;border:0!important;border-radius:16px;box-shadow:0 4px 12px rgba(15,23,42,.04);overflow:hidden}.metric{padding:20px}.metric small{display:block;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.04em}.metric strong{display:block;font-size:30px;margin-top:8px;font-weight:700;color:#172033}
.section{margin-top:24px}.section h2{font-size:17px;margin:0 0 13px;font-weight:700;color:#1e293b;text-transform:none;letter-spacing:0}
.tablewrap{overflow:auto;background:#fff;border:0;border-radius:16px;box-shadow:0 4px 12px rgba(15,23,42,.04)}.tablex{width:100%;border-collapse:collapse;font-size:13px}.tablex th{background:#f8fafc;color:#64748b;font-weight:700;text-align:left;text-transform:uppercase;font-size:11px;letter-spacing:.045em;border-bottom:1px solid var(--line)}.tablex th,.tablex td{padding:14px 15px;border-right:0;border-bottom:1px solid #eef2f7;vertical-align:middle}.tablex td{color:#334155}.tablex tr:last-child td{border-bottom:0}.tablex tbody tr:hover{background:#fbfdff}
.badge{display:inline-block;padding:5px 9px;border:1px solid #cbd5e1;border-radius:999px;font-size:11px;font-weight:700;background:#f8fafc;color:#475569}.b-yellow{background:#fef9c3;border-color:#fde047;color:#854d0e}.b-blue{background:#dbeafe;border-color:#bfdbfe;color:#1e40af}.b-green{background:#dcfce7;border-color:#bbf7d0;color:#166534}.b-red{background:#fee2e2;border-color:#fecaca;color:#991b1b}.b-gray{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.formbox{background:#fff;border:0;border-radius:16px;padding:24px;box-shadow:0 4px 12px rgba(15,23,42,.04)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#334155}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;background:#fff;font:inherit;color:#334155;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.1)}.field textarea{min-height:95px;resize:vertical}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.empty{padding:42px!important;text-align:center;color:var(--muted)}
.weekbar{display:flex;align-items:center;gap:10px;background:#fff;border:0;padding:13px;border-radius:16px;box-shadow:0 4px 12px rgba(15,23,42,.04);margin-bottom:18px}.weekbar .spacer{flex:1}.schedule{display:grid;grid-template-columns:145px repeat(6,minmax(135px,1fr));border:0;border-radius:16px;background:#fff;overflow:auto;box-shadow:0 4px 12px rgba(15,23,42,.04)}.schedule>div{min-height:105px;border-right:1px solid #eef2f7;border-bottom:1px solid #eef2f7;padding:9px}.schedule>div:nth-last-child(-n+6){border-bottom:0}.schedule .head{min-height:58px;background:#f8fafc;color:#64748b;font-weight:700;font-size:11px;text-transform:uppercase}.schedule .unit{font-weight:700;color:#334155}.slot{border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;border-radius:8px;padding:8px;margin-bottom:6px;font-size:11px}.slot.green{border-color:#bbf7d0;background:#ecfdf5;color:#166534}.slot.orange{border-color:#fed7aa;background:#fff7ed;color:#9a3412;border-style:solid}.slot.red{border-color:#fecaca;background:#fef2f2;color:#991b1b}.slot strong{display:block;font-size:12px}
.notice{padding:12px 15px;border-radius:10px;margin-bottom:16px;border:1px solid}.notice.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}.notice.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1;border:1px solid #cbd5e1;padding:10px;border-radius:8px;outline:none}.mini{font-size:11px;color:var(--muted)}.two-actions{display:flex;gap:6px;align-items:center}.modalx{border:0;padding:20px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
@media(max-width:1000px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding:24px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{position:static;width:100%;min-height:auto}.layout{display:block}.main{margin:0;width:100%;padding:20px}.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top .btnx{width:100%}.brand{margin-bottom:5px}.navx{padding-bottom:10px}}
.logout-nav-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #475569;background:transparent;color:#cbd5e1;padding:9px;border-radius:8px;font-weight:600}.logout-nav-btn:hover{background:#334155;color:#fff}.logout-nav-btn i{margin:0}
.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.catalog-note{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;color:#64748b;font-size:12px}.image-tools{display:grid;gap:8px;margin-top:9px}.image-tools .rowx{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.image-tools input[type=url]{min-width:230px;flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font:inherit}.image-preview{width:58px;height:48px;object-fit:cover;border-radius:9px;border:1px solid #e2e8f0;background:#f8fafc}.type-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.type-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.section-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:800;margin-bottom:5px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.module-link{display:block;background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;text-decoration:none;color:#1e293b;box-shadow:0 4px 12px rgba(15,23,42,.03)}.module-link:hover{border-color:#93c5fd;transform:translateY(-1px)}.module-link i{font-size:22px;color:#3b82f6}.module-link strong{display:block;margin-top:8px}.module-link span{display:block;margin-top:4px;color:#64748b;font-size:12px}
@media(max-width:900px){.module-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.module-grid{grid-template-columns:1fr}.image-tools input[type=url]{min-width:100%}}
</style>
</th:block>
