<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo servicio - SIGEM</title><th:block th:replace="~{operaciones/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{operaciones/_nav :: sidebar('servicios')}"></div><main class="main"><div class="top"><div class="title"><h1>Nuevo servicio operativo</h1><p>Registra el servicio que luego será programado y asignado.</p></div><a class="btnx" th:href="@{/operaciones/servicios}">← Volver</a></div><div th:if="${error}" class="notice err" th:text="${error}"></div><div class="formbox"><form th:action="@{/operaciones/servicios}" th:object="${servicio}" method="post"><div class="formgrid"><div class="field"><label>Contrato de servicio *</label><select th:field="*{contratoId}" required><option value="">Seleccione un contrato</option><option th:each="c:${contratos}" th:value="${c.id}" th:text="${c.numero + ' · ' + c.cliente.razonSocial}">CTR-001</option></select></div><div class="field"><label>Tipo de servicio *</label><select th:field="*{tipoServicioId}" required><option value="">Seleccione</option><option th:each="t:${tiposServicio}" th:value="${t.id}" th:text="${t.nombre}">TRANSPORTE</option></select></div><div class="field"><label>Inicio programado *</label><input type="datetime-local" th:field="*{fechaProgramada}" required></div><div class="field"><label>Fin programado</label><input type="datetime-local" th:field="*{fechaFinProgramada}"><span class="mini">Se usa para validar que la unidad y el operador no tengan otro servicio en ese rango. Vacío = jornada de 12 h.</span></div><div class="field"><label>Estado inicial</label><select th:field="*{estado}"><option value="POR_ASIGNAR">POR ASIGNAR</option><option value="SUSPENDIDO">SUSPENDIDO</option></select></div><div class="field"><label>Origen</label><input th:field="*{origen}" placeholder="Punto de partida"></div><div class="field"><label>Destino</label><input th:field="*{destino}" placeholder="Punto de llegada"></div><div class="field full"><label>Observaciones</label><textarea th:field="*{observaciones}" placeholder="Indicaciones operativas, condiciones del servicio, etc."></textarea></div></div><div class="actions" style="margin-top:18px"><button class="btnx dark" type="submit">Guardar servicio</button><a class="btnx" th:href="@{/operaciones/servicios}">Cancelar</a></div></form></div></main></div></body></html>
