<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conductores - SIGEM</title><th:block th:replace="~{operaciones/_styles :: styles}"></th:block></head><body><th:block th:replace="~{fragments/campana :: campana}"></th:block><div class="layout"><div th:replace="~{operaciones/_nav :: sidebar('conductores')}"></div><main class="main"><div class="top"><div class="title"><h1>Conductores y operadores</h1><p>Personal disponible para la operación y asignaciones vigentes.</p></div></div><div class="tablewrap"><table class="tablex"><thead><tr><th>Documento</th><th>Colaborador</th><th>Cargo</th><th>Teléfono</th><th>Estado</th><th>Asignaciones activas</th></tr></thead><tbody><tr th:each="e:${empleados}"><td th:text="${e.documento}">00000000</td><td><b th:text="${e.nombres + ' ' + e.apellidos}">Nombre Apellido</b><br><span class="mini" th:text="${e.email ?: '-'}">email</span></td><td th:text="${e.cargo}">OPERADOR</td><td th:text="${e.telefono ?: '-'}">-</td><td><span class="badge" th:classappend="${e.estado} ? ' b-green' : ' b-red'" th:text="${e.estado ? 'ACTIVO' : 'INACTIVO'}">ACTIVO</span></td><td th:text="${activas[e.id] ?: 0}">0</td></tr><tr th:if="${#lists.isEmpty(empleados)}"><td colspan="6" class="empty">No hay conductores u operadores registrados.</td></tr></tbody></table></div></main></div></body></html>
