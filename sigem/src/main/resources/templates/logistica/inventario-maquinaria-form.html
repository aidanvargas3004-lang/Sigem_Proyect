<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventario de Maquinaria - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><th:block th:replace="~{logistica/_styles :: styles}"></th:block></head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<nav class="sidebar p-3"><div class="d-flex align-items-center gap-2 mb-4 px-2"><i class="bi bi-box-seam-fill fs-3 text-primary"></i><h4 class="m-0 fw-bold">SIGEM</h4></div><div class="small text-uppercase text-secondary fw-bold px-3 mb-2">Logística y almacén</div><ul class="nav flex-column gap-1"><li><a class="nav-link" th:href="@{/logistica/dashboard}"><i class="bi bi-speedometer2"></i>Dashboard</a></li><li><a class="nav-link active" th:href="@{/logistica/inventario}"><i class="bi bi-boxes"></i>Inventario</a></li><li><a class="nav-link" th:href="@{/logistica/repuestos}"><i class="bi bi-gear-wide-connected"></i>Repuestos</a></li><li><a class="nav-link" th:href="@{/logistica/ordenes-compra}"><i class="bi bi-cart-check"></i>Órdenes de compra</a></li><li><a class="nav-link" th:href="@{/logistica/recepcion}"><i class="bi bi-truck"></i>Recepción</a></li><li><a class="nav-link" th:href="@{/logistica/movimientos}"><i class="bi bi-arrow-left-right"></i>Movimientos</a></li></ul>
    <form th:action="@{/logout}" method="post" class="mt-3 px-2">
        <button type="submit" class="btn btn-outline-light w-100 text-start">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
        </button>
    </form></nav>
<main class="main"><div class="card form-card p-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1">Registrar Inventario de Maquinaria</h2><div class="text-muted">Asigna una ubicación y situación logística a una máquina.</div></div><a class="btn btn-light" th:href="@{/logistica/inventario}"><i class="bi bi-arrow-left me-1"></i>Volver</a></div><div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
<form method="post" th:action="@{/logistica/inventario-maquinaria}" th:object="${inventario}"><div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Maquinaria *</label><select class="form-select" th:field="*{maquinariaId}" required><option value="">Seleccionar maquinaria...</option><option th:each="m : ${maquinarias}" th:value="${m.id}" th:text="${m.codigoInterno + ' - ' + m.marca + ' ' + m.modelo + (m.placa != null ? ' / ' + m.placa : '')}"></option></select></div><div class="col-md-6"><label class="form-label fw-semibold">Ubicación</label><select class="form-select" th:field="*{ubicacionId}"><option value="">Sin ubicación</option><option th:each="u : ${ubicaciones}" th:value="${u.id}" th:text="${u.codigo + ' - ' + u.nombre}"></option></select></div><div class="col-md-6"><label class="form-label fw-semibold">Situación logística *</label><select class="form-select" th:field="*{situacionLogistica}" required><option value="EN_PATIO_CENTRAL">EN_PATIO_CENTRAL</option><option value="EN_ALMACEN">EN_ALMACEN</option><option value="EN_TALLER">EN_TALLER</option><option value="EN_TRANSITO">EN_TRANSITO</option><option value="EN_OBRA_CLIENTE">EN_OBRA_CLIENTE</option></select></div><div class="col-md-6"><label class="form-label fw-semibold">Fecha ingreso</label><input type="date" class="form-control" th:field="*{fechaIngreso}"></div><div class="col-12"><label class="form-label fw-semibold">Observaciones</label><textarea class="form-control" rows="3" th:field="*{observaciones}"></textarea></div></div><div class="d-flex justify-content-between mt-4"><a class="btn btn-light" th:href="@{/logistica/inventario}">Cancelar</a><button class="btn btn-primary px-4">Registrar inventario</button></div></form></div></main>
</body></html>
