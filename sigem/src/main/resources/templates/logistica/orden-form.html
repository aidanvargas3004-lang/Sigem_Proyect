<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nueva Orden de Compra - SIGEM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><th:block th:replace="~{logistica/_styles :: styles}"></th:block></head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<nav class="sidebar p-3"><div class="d-flex align-items-center gap-2 mb-4 px-2"><i class="bi bi-box-seam-fill fs-3 text-primary"></i><h4 class="m-0 fw-bold">SIGEM</h4></div><div class="small text-uppercase text-secondary fw-bold px-3 mb-2">Logística y almacén</div><ul class="nav flex-column gap-1"><li><a class="nav-link" th:href="@{/logistica/dashboard}"><i class="bi bi-speedometer2"></i>Dashboard</a></li><li><a class="nav-link" th:href="@{/logistica/inventario}"><i class="bi bi-boxes"></i>Inventario</a></li><li><a class="nav-link" th:href="@{/logistica/repuestos}"><i class="bi bi-gear-wide-connected"></i>Repuestos</a></li><li><a class="nav-link active" th:href="@{/logistica/ordenes-compra}"><i class="bi bi-cart-check"></i>Órdenes de compra</a></li><li><a class="nav-link" th:href="@{/logistica/recepcion}"><i class="bi bi-truck"></i>Recepción</a></li><li><a class="nav-link" th:href="@{/logistica/movimientos}"><i class="bi bi-arrow-left-right"></i>Movimientos</a></li></ul>
    <form th:action="@{/logout}" method="post" class="mt-3 px-2">
        <button type="submit" class="btn btn-outline-light w-100 text-start">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
        </button>
    </form></nav>
<main class="main"><div class="card form-card p-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1">Nueva Orden de Compra</h2><div class="text-muted">Genera una orden para abastecer repuestos o materiales.</div></div><a class="btn btn-light" th:href="@{/logistica/ordenes-compra}"><i class="bi bi-arrow-left me-1"></i>Volver</a></div>
<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>
<form method="post" th:action="@{/logistica/ordenes-compra}" th:object="${orden}" id="ordenForm">
<div class="row g-3 mb-4"><div class="col-md-4"><label class="form-label fw-semibold">Número de OC *</label><input class="form-control" th:field="*{numero}" placeholder="OC-2026-001" required><div class="text-danger small" th:errors="*{numero}"></div></div><div class="col-md-5"><label class="form-label fw-semibold">Proveedor *</label><select class="form-select" th:field="*{proveedorId}" required><option value="">Seleccionar proveedor...</option><option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.razonSocial + ' - ' + p.documento}"></option></select><div class="text-danger small" th:errors="*{proveedorId}"></div></div><div class="col-md-3"><label class="form-label fw-semibold">Fecha emisión</label><input type="date" class="form-control" th:field="*{fechaEmision}"></div></div>
<div class="d-flex justify-content-between align-items-center mb-2"><h5 class="fw-bold mb-0">Detalle de la orden</h5><button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarFila()"><i class="bi bi-plus-lg me-1"></i>Agregar ítem</button></div>
<div class="table-responsive"><table class="table align-middle" id="detalleTable"><thead><tr><th>Repuesto</th><th>Descripción *</th><th style="width:130px">Cantidad *</th><th style="width:170px">Precio unitario *</th><th style="width:60px"></th></tr></thead><tbody id="detalleBody"><tr th:each="d,stat : ${orden.detalles}"><td><select class="form-select" th:name="|detalles[${stat.index}].repuestoId|"><option value="">Sin catálogo</option><option th:each="r : ${repuestos}" th:value="${r.id}" th:text="${r.codigo + ' - ' + r.nombre}" th:selected="${d.repuestoId == r.id}"></option></select></td><td><input class="form-control" th:name="|detalles[${stat.index}].descripcion|" th:value="${d.descripcion}" required></td><td><input type="number" min="1" class="form-control" th:name="|detalles[${stat.index}].cantidad|" th:value="${d.cantidad ?: 1}" required></td><td><input type="number" min="0.01" step="0.01" class="form-control" th:name="|detalles[${stat.index}].precioUnitario|" th:value="${d.precioUnitario}" required></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarFila(this)"><i class="bi bi-trash"></i></button></td></tr></tbody></table></div>
<div class="d-flex justify-content-between align-items-center mt-4"><a class="btn btn-light" th:href="@{/logistica/ordenes-compra}">Cancelar</a><button class="btn btn-primary px-4" type="submit"><i class="bi bi-check2-circle me-1"></i>Generar orden</button></div>
</form></div></main>
<script>
const repuestos = /*[[${repuestos}]]*/ [];
function agregarFila(){
 const body=document.getElementById('detalleBody'); const i=body.querySelectorAll('tr').length;
 const opciones=['<option value="">Sin catálogo</option>'].concat(Array.from(document.querySelectorAll('#detalleBody tr:first-child select option')).slice(1).map(o=>o.outerHTML)).join('');
 const tr=document.createElement('tr');
 tr.innerHTML=`<td><select class="form-select" name="detalles[${i}].repuestoId">${opciones}</select></td><td><input class="form-control" name="detalles[${i}].descripcion" required></td><td><input type="number" min="1" class="form-control" name="detalles[${i}].cantidad" value="1" required></td><td><input type="number" min="0.01" step="0.01" class="form-control" name="detalles[${i}].precioUnitario" required></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarFila(this)"><i class="bi bi-trash"></i></button></td>`;
 body.appendChild(tr);
}
function eliminarFila(btn){const rows=document.querySelectorAll('#detalleBody tr'); if(rows.length<=1){alert('La orden debe tener al menos un ítem.');return;} btn.closest('tr').remove(); reindexar();}
function reindexar(){document.querySelectorAll('#detalleBody tr').forEach((tr,i)=>tr.querySelectorAll('input,select').forEach(el=>{el.name=el.name.replace(/detalles\[\d+\]/,'detalles['+i+']');}));}
</script>
</body></html>
