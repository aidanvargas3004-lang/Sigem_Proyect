<th:block th:fragment="styles">
<style>
:root{--side:#0f172a;--side-hover:#1e293b;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb}
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.layout{display:flex;min-height:100vh}.sidebar{width:260px;min-height:100vh;background:var(--side);color:#fff;position:fixed;left:0;top:0;bottom:0;z-index:1000;display:flex;flex-direction:column}.brand{padding:22px 20px;border-bottom:1px solid rgba(148,163,184,.15);font-weight:800}.brand-title{font-size:17px}.brand small{display:block;color:#94a3b8;font-weight:500;margin-top:4px}.navx{padding:12px 8px;flex:1}.navx a{display:flex;align-items:center;gap:12px;margin:2px 0;padding:11px 14px;border-left:3px solid transparent;border-radius:7px;color:#94a3b8;text-decoration:none;font-weight:500}.navx a:hover,.navx a.active{color:#fff;background:var(--side-hover);border-left-color:var(--primary)}.navx i{width:19px;text-align:center}.nav-footer{padding:14px;border-top:1px solid rgba(148,163,184,.15)}.userbox{display:flex;gap:10px;align-items:center;padding:8px;color:#e2e8f0}.userbox i{font-size:24px}.userbox strong{display:block;font-size:13px}.userbox small{display:block;color:#94a3b8;font-size:11px}.logout-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #475569;background:transparent;color:#cbd5e1;padding:9px;border-radius:8px;font-weight:600}.logout-btn:hover{background:#334155;color:#fff}.main{margin-left:260px;width:calc(100% - 260px);padding:32px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.card{border:0;border-radius:16px}.tablewrap{overflow:auto;border-radius:16px}.empty{padding:40px;text-align:center;color:#64748b}
@media(max-width:900px){.sidebar{position:static;width:100%;min-height:auto}.layout{display:block}.main{margin-left:0;width:100%;padding:20px}.navx{display:flex;flex-wrap:wrap}.nav-footer{position:static}.userbox{display:none}}
</style>
</th:block>
