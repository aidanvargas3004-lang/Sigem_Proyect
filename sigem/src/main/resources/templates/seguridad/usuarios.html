<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usuarios - SIGEM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<th:block th:replace="~{seguridad/_styles :: styles}"></th:block>
</head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div class="layout">
  <div th:replace="~{seguridad/_nav :: sidebar('usuarios')}"></div>
  <main class="main">
    <div class="topbar">
      <div><h1 class="fw-bold mb-1">Usuarios</h1><p class="text-secondary mb-0">Cuentas y acceso por rol.</p></div>
      <a class="btn btn-primary" th:href="@{/seguridad/usuarios/nuevo}"><i class="bi bi-person-plus me-1"></i>Nuevo usuario</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card shadow-sm border-0 p-0 overflow-hidden">
      <div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Usuario</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th class="text-end">Acción</th></tr></thead>
        <tbody>
          <tr th:each="u:${usuarios}">
            <td><strong th:text="${u.username}">admin</strong></td>
            <td th:text="${u.nombres + ' ' + u.apellidos}">Administrador</td>
            <td th:text="${u.email}">admin@transur.com</td>
            <td><span class="badge text-bg-primary" th:text="${u.rol.nombre}">ADMIN</span></td>
            <td><span class="badge" th:classappend="${u.estado} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${u.estado ? 'ACTIVO' : 'INACTIVO'}">ACTIVO</span></td>
            <td class="text-end"><form th:action="@{/seguridad/usuarios/{id}/estado(id=${u.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${u.estado ? 'Desactivar' : 'Activar'}">Desactivar</button></form></td>
          </tr>
          <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6" class="empty">No hay usuarios registrados.</td></tr>
        </tbody>
      </table></div>
    </div>
  </main>
</div>
</body></html>
