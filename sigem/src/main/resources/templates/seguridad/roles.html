<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roles - SIGEM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<th:block th:replace="~{seguridad/_styles :: styles}"></th:block>
</head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div class="layout">
  <div th:replace="~{seguridad/_nav :: sidebar('roles')}"></div>
  <main class="main">
    <div class="topbar">
      <div><h1 class="fw-bold mb-1">Roles</h1><p class="text-secondary mb-0">Roles base y roles adicionales del sistema.</p></div>
      <a class="btn btn-primary" th:href="@{/seguridad/roles/nuevo}"><i class="bi bi-plus-lg me-1"></i>Nuevo rol</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card shadow-sm border-0 p-0 overflow-hidden">
      <div class="table-responsive"><table class="table mb-0 align-middle">
        <thead><tr><th>Rol</th><th>Descripción</th><th>Estado</th></tr></thead>
        <tbody>
          <tr th:each="r:${roles}"><td><strong th:text="${r.nombre}">ADMIN</strong></td><td th:text="${r.descripcion}">Acceso total</td><td><span class="badge" th:classappend="${r.estado} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${r.estado ? 'ACTIVO' : 'INACTIVO'}">ACTIVO</span></td></tr>
          <tr th:if="${#lists.isEmpty(roles)}"><td colspan="3" class="empty">No hay roles registrados.</td></tr>
        </tbody>
      </table></div>
    </div>
  </main>
</div>
</body></html>
