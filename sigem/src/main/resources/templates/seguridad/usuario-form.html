<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuevo usuario - SIGEM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<th:block th:replace="~{seguridad/_styles :: styles}"></th:block>
</head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div class="layout">
  <div th:replace="~{seguridad/_nav :: sidebar('usuarios')}"></div>
  <main class="main">
    <div class="topbar"><div><h1 class="fw-bold mb-1">Nuevo usuario</h1><p class="text-secondary mb-0">La contraseña se almacena con BCrypt.</p></div><a class="btn btn-outline-secondary" th:href="@{/seguridad/usuarios}">← Volver</a></div>
    <div class="card shadow-sm border-0 p-4" style="max-width:900px">
      <form th:action="@{/seguridad/usuarios/guardar}" method="post" class="row g-3">
        <div class="col-md-6"><label class="form-label">Usuario</label><input class="form-control" name="username" required></div>
        <div class="col-md-6"><label class="form-label">Contraseña</label><input class="form-control" name="password" type="password" minlength="8" required></div>
        <div class="col-md-6"><label class="form-label">Nombres</label><input class="form-control" name="nombres" required></div>
        <div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" name="apellidos" required></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div>
        <div class="col-md-6"><label class="form-label">Rol</label><select class="form-select" name="rolId" required><option value="">Seleccione...</option><option th:each="r:${roles}" th:value="${r.id}" th:text="${r.nombre}">ADMIN</option></select></div>
        <div class="col-12 d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/seguridad/usuarios}">Cancelar</a><button class="btn btn-primary" type="submit">Crear usuario</button></div>
      </form>
    </div>
  </main>
</div>
</body></html>
