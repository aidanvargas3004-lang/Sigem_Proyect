<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuevo rol - SIGEM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<th:block th:replace="~{seguridad/_styles :: styles}"></th:block>
</head>
<body><th:block th:replace="~{fragments/campana :: campana}"></th:block>
<div class="layout">
  <div th:replace="~{seguridad/_nav :: sidebar('roles')}"></div>
  <main class="main">
    <div class="topbar"><div><h1 class="fw-bold mb-1">Nuevo rol</h1><p class="text-secondary mb-0">Crea un rol adicional para la gestión de accesos.</p></div><a class="btn btn-outline-secondary" th:href="@{/seguridad/roles}">← Volver</a></div>
    <div class="card shadow-sm border-0 p-4" style="max-width:720px">
      <form th:action="@{/seguridad/roles/guardar}" method="post">
        <div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" name="nombre" required></div>
        <div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="4"></textarea></div>
        <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/seguridad/roles}">Cancelar</a><button class="btn btn-primary" type="submit">Crear rol</button></div>
      </form>
    </div>
  </main>
</div>
</body></html>
